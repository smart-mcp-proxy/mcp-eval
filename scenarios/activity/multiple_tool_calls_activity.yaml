# Activity Log Verification: Multiple Tool Calls Generate Activity Records
# This scenario makes multiple tool calls and verifies each generates activity

enabled: true
name: "Multiple Tool Calls Generate Activity"
description: "Verify that multiple tool calls each generate activity records"
config_file: "configs/minimal_config.json"
user_intent: "Search for echo tools, then call the echo tool on everything-2 server with message 'multi-test', then list servers"

expected_trajectory:
  - action: "search_tools"
    tool: "mcp__mcpproxy__retrieve_tools"
    args:
      query: "echo"
  - action: "list_servers"
    tool: "mcp__mcpproxy__upstream_servers"
    args:
      operation: "list"
  - action: "call_tool"
    tool: "mcp__mcpproxy__call_tool"
    args:
      name: "everything-2:echo"
      args_json: '{"message": "multi-test"}'

# User Role control actions - verify multiple activities logged
user_control_actions:
  - trigger: "after_tool_3"
    action: "verify_activity_count"
    tool: "api_v1_activity"
    args:
      limit: 10
    expected_result:
      success: true
      # Should have at least 3 activity records from this session
      contains:
        - "tool_call"

success_criteria:
  - "mcp__mcpproxy__retrieve_tools"
  - "mcp__mcpproxy__call_tool"
  - "mcp__mcpproxy__upstream_servers"
  - "echo"

tags:
  - "activity_log"
  - "tool_call"
  - "multi_step"
  - "control_actions"
