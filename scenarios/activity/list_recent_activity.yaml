# Activity Log Verification: List Recent Activity
# This scenario retrieves activity records and verifies the REST API works

enabled: true
name: "List Recent Activity"
description: "User wants to see recent tool call activity from the activity log"
config_file: "configs/minimal_config.json"
user_intent: "Show me recent activity and tool usage statistics"

expected_trajectory:
  - action: "retrieve_tools"
    tool: "mcp__mcpproxy__retrieve_tools"
    args:
      query: "recent activity log tool usage statistics"
      include_stats: true
      limit: 20

# User Role control actions - directly query activity log via REST API
user_control_actions:
  - trigger: "after_tool_1"
    action: "list_all_activity"
    tool: "api_v1_activity"
    args:
      limit: 20
    expected_result:
      success: true

success_criteria:
  - "mcp__mcpproxy__retrieve_tools"
  - "activity"
  - "tool"

tags:
  - "activity_log"
  - "observability"
  - "control_actions"
