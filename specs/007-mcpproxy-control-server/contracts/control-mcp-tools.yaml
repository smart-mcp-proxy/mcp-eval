# MCPProxy Control MCP Server - Tool Reference
#
# NOTE: With FastMCP v2, tools are AUTO-GENERATED from mcpproxy's OpenAPI spec:
#   mcpproxy-go/oas/swagger.yaml
#
# This file documents the expected tools for reference/testing purposes.
# The actual MCP server is created dynamically using:
#   FastMCP.from_openapi(openapi_spec, client, route_map_fn=control_route_mapper)
#
# Tool names are auto-generated by FastMCP from OpenAPI paths:
#   /api/v1/config -> api_v1_config
#   /api/v1/servers/{id}/unquarantine -> api_v1_servers_id_unquarantine

openapi: 3.1.0
info:
  title: MCPProxy Control MCP Tools (Reference)
  version: 1.0.0
  description: |
    Reference documentation for MCP tools auto-generated from mcpproxy REST API.
    These tools are available only to the User Role in the dialog engine.

    Source OAS: mcpproxy-go/oas/swagger.yaml
    Generation: FastMCP v2 from_openapi()

# Exposed Endpoints (via route_map_fn filter)
exposed_endpoints:
  - path: /api/v1/config
    method: GET
    tool_name: api_v1_config
    description: Read current mcpproxy configuration

  - path: /api/v1/servers
    method: GET
    tool_name: api_v1_servers
    description: List all upstream MCP servers (filter for quarantined)

  - path: /api/v1/servers/{id}/restart
    method: POST
    tool_name: api_v1_servers_id_restart
    description: Restart connection to specific upstream server

  - path: /api/v1/servers/{id}/logs
    method: GET
    tool_name: api_v1_servers_id_logs
    description: Get log entries for specific server

  - path: /api/v1/servers/{id}/quarantine
    method: POST
    tool_name: api_v1_servers_id_quarantine
    description: Place server in quarantine

  - path: /api/v1/servers/{id}/unquarantine
    method: POST
    tool_name: api_v1_servers_id_unquarantine
    description: Remove server from quarantine

  - path: /healthz
    method: GET
    tool_name: healthz
    description: Health check endpoint

# Route Mapping Configuration
route_map_config:
  description: |
    FastMCP route_map_fn filters which OpenAPI endpoints become MCP tools.
    Only control-relevant endpoints are exposed to User Role.

  include_patterns:
    - /api/v1/config
    - /api/v1/servers
    - /api/v1/servers/{id}/restart
    - /api/v1/servers/{id}/logs
    - /api/v1/servers/{id}/quarantine
    - /api/v1/servers/{id}/unquarantine
    - /healthz

  exclude_patterns:
    - /api/v1/tools/*        # Agent uses native MCP for tools
    - /api/v1/sessions/*     # Not needed for User Role
    - /api/v1/registries/*   # Agent handles registry operations
    - /api/v1/secrets/*      # Security-sensitive
    - /api/v1/docker/*       # Infrastructure detail

# Example Scenario Usage
example_scenario:
  name: "Unquarantine Flow"
  user_control_actions:
    - trigger: "after_quarantine"
      tool: "api_v1_servers_id_unquarantine"
      args:
        id: "test-server"
      expected_result:
        success: true
        action: "unquarantine"
